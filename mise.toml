min_version = "2024.9.5"

[tools]
bun = "1.3.11"
java = "21.0.2"
kotlin = "2.3.21"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]
KOTLIN_API_SERVER = { default = "https://api.kotlinlang.org" }
KOTLIN_COMPILER_VERSION = { default = "2.0.21" }
KOTLIN_API_TIMEOUT_MS = { default = "15000" }
KOTLIN_EXECUTION_MODE = { default = "auto" }
KOTLIN_LOCAL_COMPILE_TIMEOUT_MS = { default = "15000" }
KOTLIN_LOCAL_EXECUTION_TIMEOUT_MS = { default = "3000" }
KOTLIN_VALIDATION_CONCURRENCY = { default = "4" }
KOTLIN_VALIDATION_TIMEOUT_MS = { default = "60000" }
DATABASE_URL = { default = "file:./data/tutorial.db" }
BETTER_AUTH_URL = { default = "http://localhost:3000" }
BETTER_AUTH_SECRET = { default = "local-development-secret-change-before-deploying" }

[tasks.install]
alias = "i"
description = "Install dependencies and update bun.lock when needed"
run = "bun install"

[tasks."install:frozen"]
alias = "ci"
description = "Install exactly what is recorded in bun.lock"
run = "bun install --frozen-lockfile"

[tasks.dev]
alias = "d"
description = "Start the Next.js development server"
depends = ["db:migrate", "kotlin:worker:build"]
run = "bun run dev"

[tasks."kotlin:worker:build"]
description = "Build the persistent local Kotlin compiler worker"
run = "bun run kotlin:worker:build"

[tasks."db:generate"]
description = "Generate a Drizzle migration after changing the schema"
run = "bun run db:generate"

[tasks."db:migrate"]
description = "Apply database migrations"
run = "bun run db:migrate"

[tasks."db:studio"]
description = "Open Drizzle Studio for the configured database"
run = "bun run db:studio"

[tasks.start]
description = "Start the production server"
depends = ["kotlin:worker:build"]
run = "bun run start"

[tasks.lint]
alias = "l"
description = "Run ESLint"
run = "bun run lint"

[tasks.typecheck]
alias = "tc"
description = "Run the TypeScript compiler without emitting files"
run = "bun run typecheck"

[tasks.test]
alias = "t"
description = "Run the test suite once"
run = "bun run test:run"

[tasks."test:watch"]
description = "Run the test suite in watch mode"
run = "bun run test"

[tasks."test:solutions"]
description = "Execute every Kotlin solution with the app's persistent worker"
run = "bun run test:solutions"

[tasks."test:solutions:cli"]
description = "Execute every Kotlin solution with standalone kotlinc processes"
run = "bun run test:solutions:cli"

[tasks."test:kotlin-worker"]
description = "Smoke-test the persistent local Kotlin compiler"
depends = ["kotlin:worker:build"]
run = "bun run test:kotlin-worker"

[tasks.build]
alias = "b"
description = "Create a production build"
depends = ["kotlin:worker:build"]
run = "bun run build"

[tasks.check]
alias = "c"
description = "Run lint, typecheck, tests, and a production build"
depends = ["kotlin:worker:build"]
run = "bun run check"

[tasks."check:all"]
description = "Run the app checks and validate every Kotlin solution"
run = "bun run check:all"
